# 科技需求五区标准（PRD v1.3 §4）：A 公共 / B 业务(Why) / C 用户(Who/What) / D 功能(How)
# E 区为系统维护（elementStatus/fieldSources/revision/changeLog/askHistory），不在交互要素内。
# 旧六要素映射（PRD §4.4，详见 migration_map.py）：
#   title→A1 title / demandTypeCode→A2 / techSubtype→A3 / content→A8(+B2) /
#   businessScenario→C3 useScenario / valueImpact→B3 businessValue / acceptanceCriteria→D8
type: TECH
name: 科技需求
version: '4'
glossary:
- 代销系统：面向银行/券商等代销渠道的销售与结算系统
- 晨会：一线部门每个交易日 8:30 前的例会
elements:
# ---- A 区：公共要素（所有科技需求必填）----
- key: title
  code: A1
  zone: A
  label: 需求标题
  kind: text
  required: true
  ok_when: 一句话，2~60 字，能看出要解决什么问题
  rule:
    min_len: 2
    max_len: 60
  ask_l1: 我把需求标题记为「{snippet}」，你看合适吗？不合适直接告诉我改成什么。
- key: demandTypeCode
  code: A2
  zone: A
  label: 需求类型
  kind: enum
  required: true
  options:
    TECH: 科技需求
    MATL: 物料需求
    TRAIN: 培训需求
# A3 科技需求子类（2026-10-15 拍板）：管理端分类/统计标签，不驱动判型、B 区激活、轻重判定、分派等任何业务逻辑。
# 提报人难以区分（"系统开发/集成/运维"对业务人员是术语），改为 AI 按提报内容自动归类（判别规则见 submit_guide.md）、
# 永不追问：选填不入提交门槛、assessed:false 不进质量评估（计数 x/26，同 D9 口径——AI 判的字段不让提报人背质量分）；
# 判不出或跨界归 OTHER 不留空。H5 表单保留选填展示（AI 值可见可改），管理端照常展示/编辑，改型清空后下轮对话自动重判。
- key: techSubtype
  code: A3
  zone: A
  label: 科技需求子类
  kind: enum
  path: elements.A.techSubtype
  assessed: false
  options:
    SYS_DEV: 系统开发
    DATA_RPT: 数据报表
    SYS_INT: 系统集成
    OPS_OPT: 运维优化
    OTHER: 其他
- key: requester
  code: A4
  zone: A
  label: 提报人
  kind: text
  system: true
  required: true
- key: dept
  code: A5
  zone: A
  label: 部门/小组
  kind: text
  system: true
  required: true
# A6 紧急程度（2026-10-15 拍板）：追问沉底、所有必填项最后问（排序见 policy.py pick_follow_up）——
# 排期类信息待需求本体问齐后再确认；答「紧急/特急」时急单门控承接追问期望交付时间，恰好收尾。
- key: urgency
  code: A6
  zone: A
  label: 紧急程度
  kind: enum
  required: true
  options:
    NORMAL: 普通
    URGENT: 紧急
    CRITICAL: 特急
  ask_missing: 这个需求有多紧急？普通按常规排期；紧急或特急请说明期望时间，便于排期。
- key: expectDeliveryAt
  code: A7
  zone: A
  label: 期望交付时间
  kind: date
  ask_missing: 这个需求比较急。期望什么时候交付？说个大概时间就行，比如「月底前」或「11月20日」。
# A8 原始提报文本（2026-10-19 拍板定位调整）：系统提取的用户原话底稿（对话首轮回填/手改长文本归位/提交兜底），
# 用户可编辑但永不由 AI 追问、不作提交门槛——「原始提报文本」不是用户能理解的要素概念。
# 质量清单保留展示（非空即合格、空缺失仅标记）；min_len 已删——非必填格式校验同样拦提交，短标题兜底回填反被卡
- key: content
  code: A8
  zone: A
  label: 原始提报文本
  kind: text
  required: false
  placeholder: 系统自动记录你说的原话，一般不用改
  ok_when: 用户原始描述完整保留，作为追溯底稿
# ---- B 区：业务需求要素（Why——识别为业务需求时必填，提交按 active_zones 条件生效）----
- key: businessGoal
  code: B1
  zone: B
  label: 业务目标
  kind: text
  path: elements.B.businessGoal
  required: true
  ok_when: 组织/部门要达成的可衡量目标，≥15 字，含量化词
  rule:
    min_len: 15
    any_of_regex:
    - \d
    - 提升|提高|降低|减少|增加|覆盖|达成|缩短
  vague_hint: 目标不够可衡量，缺量化词
  ask_missing: 这个需求背后，部门或团队要达成的业务目标是什么？尽量可衡量，比如「把客户回访覆盖率从 60% 提升到 80%」。
  anchor_key: userGoal
  ask_anchor: 用户侧要完成「{anchor}」——那部门或团队层面想达成什么业务目标？尽量可衡量，比如「把客户回访覆盖率从 60% 提升到 80%」。
  ask_l1: 「{snippet}」还不太像可衡量的目标——能补一个量化口径吗？比如比例、时长、次数。
  ask_l2: 参考句式：「把__（指标）从__提升/降低到__（量化值）」。
- key: businessBackground
  code: B2
  zone: B
  label: 业务背景
  kind: text
  path: elements.B.businessBackground
  required: true
  ok_when: 说明现状与为什么现在要做，≥15 字
  rule:
    min_len: 15
  vague_hint: 缺少现状与动因说明
  ask_missing: 说说这项需求的业务背景：现状是怎样的，为什么现在要做？
  ask_l1: 「{snippet}」背景还偏简略——现在的做法是什么、遇到了什么问题促使现在提出来？
  ask_l2: 参考句式：「目前__（现状做法），存在__（问题），因此需要__」。
- key: businessValue
  code: B3
  zone: B
  label: 业务价值
  kind: text
  path: elements.B.businessValue
  required: true
  ok_when: 含量化事实（多少人/多少时间/不做的后果）
  rule:
    any_of_regex:
    - \d
    - 不做
    - 否则
    - 影响
    - 风险
  vague_hint: 缺量化事实（人数/时长/后果）
  ask_missing: 这个需求不做的话有什么影响？量化一下，比如「20多个客户经理每人每天花40分钟手工整理」。
  ask_l1: 再具体一点点：大概影响多少人或几个部门？每次能省多少时间？
  ask_l2: 参考句式：「影响__人/__个部门，每次节省约__分钟；不做会__」。
- key: stakeholders
  code: B4
  zone: B
  label: 干系人
  kind: list
  path: elements.B.stakeholders
  required: true
  ok_when: 列出业务方、承接方、受益方
  vague_hint: 看不出业务方/承接方/受益方
  ask_missing: 这个需求涉及哪些干系人？比如谁提出的业务方、谁承接建设、谁是受益方。
  anchor_key: userRole
  ask_anchor: 主要使用方「{anchor}」我已经记下了。这条需求是谁提出的（业务方）、谁来承接建设？受益方按主要使用者记录。
  ask_l1: 能列一下相关的部门或角色吗？例如「银行渠道部提出，客服部承接，客户经理和渠道产品经理受益」。
- key: businessRules
  code: B5
  zone: B
  label: 业务规则/合规约束
  kind: text
  path: elements.B.businessRules
  ok_when: 数据合规、监管要求等约束写清楚；无约束可留空
  ask_missing: 有没有必须遵守的业务规则或合规约束？比如数据脱敏、监管报送口径。没有可留空。
- key: upstreamGoal
  code: B6
  zone: B
  label: 归属的上级目标
  kind: text
  path: elements.B.upstreamGoal
  ok_when: 填写上游业务目标（如公司战略/部门年度目标），便于拆条溯源；可留空
  ask_missing: 这条需求归属于哪个上游业务目标或战略？例如「提升客户回访率至 80%」。没有可留空。
- key: relatedDemands
  code: B7
  zone: B
  label: 关联需求
  kind: list
  path: elements.B.relatedDemands
  ok_when: 同源拆分或关联需求编号列表；可留空
  ask_missing: 是否有关联或同源拆分的需求编号？有可列出，没有可留空。
# ---- C 区：用户需求要素（Who/What——用户要做什么）----
- key: userRole
  code: C1
  zone: C
  label: 目标用户角色
  kind: text
  path: elements.C.userRole
  required: true
  ok_when: 明确谁在用：客户经理/运营/专员/机构等
  rule:
    any_of:
    - 客户经理
    - 理财经理
    - 专员
    - 机构
    - 营业部
    - 部门
    - 经理
    - 同事
    - 运营
    - 柜员
    - 主管
  vague_hint: 看不出谁在用
  ask_missing: 这个需求主要给谁用？比如机构业务部客户经理、运营专员。
  ask_l1: 「{snippet}」里还看不出具体角色——是客户经理、运营专员，还是其他岗位？
  ask_l2: 可以这样写：「机构业务部客户经理」「分公司运营专员」。
- key: userGoal
  code: C2
  zone: C
  label: 用户目标
  kind: text
  path: elements.C.userGoal
  required: true
  ok_when: 用户要达成的任务目标，含时机/频率，≥10 字
  rule:
    min_len: 10
  vague_hint: 看不出用户要完成什么任务
  ask_missing: 用户想用这个能力完成什么任务？大概什么时候、多久用一次？
  ask_l1: 再说说用户要达成的具体任务吧，比如「晨会前快速查看各机构持仓汇总」。
  ask_l2: 参考句式：「在__（时机/频率），完成__（任务）」。
- key: useScenario
  code: C3
  zone: C
  label: 使用场景
  kind: text
  path: elements.C.useScenario
  required: true
  ok_when: 含角色 + 时机/频率 + 任务，≥15 字，无歧义词
  rule:
    min_len: 15
    any_of:
    - 每天
    - 每周
    - 每月
    - 每次
    - 当
    - 时
    - 晨会
    - 月底
    - 季
    - 客户经理
    - 理财经理
    - 专员
    - 机构
    - 营业部
    - 部门
    - 经理
    - 同事
  vague_hint: 看不出谁在用、什么时候用
  ask_missing: 再说说使用场景吧：谁（角色）、在什么时间/频率、用它来做什么？比如「银行渠道部客户经理，每天晨会前查各渠道持仓」。
  # C3 双锚定（2026-10-15 拍板）：角色/任务已识别时不重复问「谁」，改为引述已识别信息请用户
  # 确认或纠正，再问未覆盖的缺口——双锚（角色+任务都已知）只问时机/频率，单锚（仅角色已知）
  # 问时机+任务，角色未知回落上面的 ask_missing
  anchor_key: userRole
  anchor_key2: userGoal
  ask_anchor: 主要使用方「{anchor}」我记下了，有不对的地方直接纠正。再说说使用场景：在什么时间/频率、用它来完成什么？比如「银行渠道部客户经理，每天晨会前查各渠道持仓」。
  ask_anchor2: 使用场景我先记着：「{anchor}」要「{anchor2}」——有不对的地方直接纠正。再补一句：大概在什么时间、多久用一次？比如「每天晨会前」「每2-3天做一次」。
  ask_l1: 记下了。不过「{snippet}」还有点概括——能再具体说说哪些人、在什么时机用吗？
  ask_l2: 可以这样写：「作为__（角色），在__（时间/频率），需要__（做什么）」。示例：作为渠道业务部专员，每周一早上，需要汇总各渠道销量。
- key: useFrequency
  code: C4
  zone: C
  label: 使用频率
  kind: text
  path: elements.C.useFrequency
  ok_when: 每天/每周/每月/每次等；可留空
  ask_missing: 大概多久用一次？每天、每周、每月还是按需？可留空。
- key: painPoint
  code: C5
  zone: C
  label: 用户痛点
  kind: text
  path: elements.C.painPoint
  required: true
  ok_when: 现状困难描述清楚，含量化事实更佳，≥10 字
  rule:
    min_len: 10
  vague_hint: 痛点不够具体
  ask_missing: 关于「现在最麻烦的事」——做这件事最费劲的地方是什么？比如「手工汇总20多个机构数据，每次近1小时还容易错」。
  ask_l1: 关于「现在最麻烦的事」——「{snippet}」还比较概括，具体卡在哪一步？大概多花多少时间？
  ask_l2: 参考句式：「目前需要__（手工步骤），每次约__分钟，容易__（问题）」。
- key: userCount
  code: C6
  zone: C
  label: 用户规模
  kind: number
  path: elements.C.userCount
  ok_when: 受影响用户的大致人数；可留空
  ask_missing: 大概多少用户会受影响？填个估计数即可，可留空。
# ---- D 区：功能需求要素（How——系统必须做什么）----
- key: functionDescription
  code: D1
  zone: D
  label: 功能描述
  kind: text
  path: elements.D.functionDescription
  required: true
  ok_when: 系统要做什么，行为描述清楚，≥10 字
  rule:
    min_len: 10
  vague_hint: 看不出系统要做什么
  ask_missing: 系统需要做什么？描述一下期望的功能行为，比如「按渠道汇总前一交易日持仓并支持导出」。
  ask_l1: 「{snippet}」还没说清系统要干什么——它收到什么、处理成什么、给谁看？
  ask_l2: 参考句式：「系统应__（动作）__（对象），并支持__（输出）」。
- key: inputOutput
  code: D2
  zone: D
  label: 输入/输出
  kind: text
  path: elements.D.inputOutput
  required: true
  ok_when: 说明输入数据与产出物（报表/推送/接口）
  rule:
    min_len: 5
    any_of:
    - 输入
    - 输出
    - 报表
    - 推送
    - 接口
    - 导出
    - 数据
    - 页面
    - 展示
  vague_hint: 缺输入或产出物说明
  ask_missing: 这个功能的输入数据和产出物分别是什么？比如「输入交易流水，输出按渠道汇总的持仓报表」。
  ask_l1: 补充一下数据从哪来、结果以什么形式给出（页面/报表/推送/接口）？
- key: businessRuleMap
  code: D3
  zone: D
  label: 功能要遵守的规则
  kind: text
  path: elements.D.businessRuleMap
  ok_when: 功能须遵守的 B 区规则细化；可留空
  ask_missing: 功能层面要遵守哪些业务规则细化？与 B 区规则对应的可列出，可留空。
- key: dataRequirements
  code: D4
  zone: D
  label: 数据需求
  kind: text
  path: elements.D.dataRequirements
  ok_when: 数据源、字段、口径、刷新频率；可留空
  ask_missing: 涉及哪些数据源、字段口径和刷新频率？比如「代销系统交易库，按机构汇总，每交易日 8:00 前刷新」。可留空。
- key: interfaceRequirements
  code: D5
  zone: D
  label: 接口/集成需求
  kind: text
  path: elements.D.interfaceRequirements
  ok_when: 对接系统、流向、时效、异常；可留空
  ask_missing: 需要与哪些系统对接？数据流向和时效要求是什么？可留空。
- key: nfrRequirements
  code: D6
  zone: D
  label: 性能与安全要求
  kind: list
  path: elements.D.nfrRequirements
  ok_when: 性能/安全/可用性要求（秒级、脱敏、通过率）；可留空
  ask_missing: 有没有性能、安全类要求？比如「查询 3 秒内返回」「客户敏感信息脱敏」。可留空。
- key: exceptionHandling
  code: D7
  zone: D
  label: 异常与边界
  kind: text
  path: elements.D.exceptionHandling
  ok_when: 失败重试、无数据处理、权限边界；可留空
  ask_missing: 异常场景怎么处理？比如同步失败重试、无数据时的展示、权限边界。可留空。
- key: acceptanceCriteria
  code: D8
  zone: D
  label: 验收标准
  kind: text
  path: elements.D.acceptanceCriteria
  required: true
  ok_when: 含可量化指标（数字/时间/误差/通过率），或明确的可逐条核对的行为结果（能打开/不报错/免手工等）
  rule:
    # 数字指标与"行为结果"地位平等（2026-10-12 拍板）：验收也可由可逐条核对的行为结果承载——
    # 「点击链接可直接打开，不再提示非法网页，无需复制到浏览器」虽无数字，但含三个明确可验证结果。
    # 原词表按报表类需求配（误差/对账/通过率），会把体验修复类验收误伤成"不可检验"
    any_of_regex:
    - \d
    - 误差
    - 对账
    - 通过率
    - 准确率
    - 检查
    - 为准
    - 一致
    - 可?直接打开
    - 正常(打开|显示|使用|运行|访问|提交|保存)
    - 不再(提示|出现|报错|弹|显示)
    - 无需(复制|手工|手动|重复|再)
    - 恢复正常
    - 修复
  vague_hint: 缺可检验的验收指标或行为结果
  ask_missing: 怎样算这个需求做完了？给一个可检查的标准，比如「连续一周与核心系统对账误差为0」，或「点击链接可直接打开、不再提示非法网页」。
  ask_l1: 关于「怎样算做完」——「{snippet}」还不太可检验，能补个可逐条核对的结果吗？可以是量化指标（时间、准确率），也可以是明确行为（能直接打开、不再报错、无需手工）。
  ask_l2: 参考句式：「当__时，系统应__；检查项：①__②__」。
# D9 建议方案（2026-10-12 拍板）：承载提报人设想的实现方式/候选方案与选择关系（如"两个方案二选一"）。
# 定位是"设想供评估"而非"定案"：选填、永不追问（不入 follow_up_order）、不进任何提交门槛，
# AI 记录后话术告知"最终用哪个由产品和技术评估后定"；备案等硬约束仍归 B5，不与之混装。
# 此前这类信息因五区无归属槽位被白名单静默丢弃（coze 迁移/备案样本暴露），受理方结构化视图不可见。
- key: proposedSolution
  code: D9
  zone: D
  label: 建议方案
  kind: text
  path: elements.D.proposedSolution
