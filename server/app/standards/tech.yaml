# BR-T13 粒度治理：目标级分解 / 字段级补全，收敛标准统一
granularity:
  converge: 可验证、可追踪、可独立受理
  too_broad:
    keywords:
    - 提升
    - 提高到
    - 全面
    - 整体
    - 战略
    - 体系
    - 平台化
    hint: 这是一个业务目标级需求，建议先聚焦其中一条可独立受理的子需求，其余可先保存为草稿。
  too_narrow:
    keywords:
    - 加个字段
    - 加字段
    - 加个列
    - 显示一下
    - 按钮
    hint: 这个需求偏字段级，建议补充所属功能、使用场景与用户角色，便于整体评估。
