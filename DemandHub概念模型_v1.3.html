<div style="margin:0 0 14px;font-size:13.5px;color:#475569;">创金合信基金 · 零售业务线 ｜ v1.3 修订：DemandHub 不注册独立企微应用，创金零售以一次性 SSO 票据 + 服务端回源 verify 完成 H5 免登，PC 管理端账号密码登录；渠道枚举去 WECOM_APP（预留停用）；业务角色收敛为 ADMIN/EXECUTIVE/MANAGER/HANDLER 角色族（组织子树 × 需求类型范围三维授权）；通知一期站内信，企微应用消息二期</div>

<text x="36" y="920" font-size="12.5" fill="#334155">· 需求编号：类型前缀+日期+流水，如 TECH-20260919-001</text>

<text x="36" y="968" font-size="12.5" fill="#334155">· 票据有效自动建ACTIVE直接提报；字段缺失才PENDING；支持合并</text>
<text x="36" y="984" font-size="12.5" fill="#334155">· 角色族ADMIN/EXECUTIVE/MANAGER/HANDLER×组织子树×类型范围</text>
<text x="36" y="1000" font-size="12.5" fill="#334155">· 提报时点快照留痕，主数据以 demand_user/demand_org 为准</text>
<text x="36" y="1016" font-size="12.5" fill="#334155">· PC账密(BCrypt)；H5票据免登；不注册企微应用；一期站内信</text>
