server:
  port: 8084

spring:
  application:
    name: demandhub-agent
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:demandhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:demandhub123}
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: demandhub-agent-producer
    send-message-timeout: 5000

demandhub:
  agent:
    llm:
      # 大模型平台 Mock（一期）：运行期可通过 /agent/admin/llm-switch 切换，模拟故障验证降级
      mock-enabled: true
      # SSE 流式分片大小与"思考"延迟，模拟真实流式体验
      chunk-size: 6
      think-delay-ms: 150

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true
  packages-to-scan: com.demandhub.agent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demandhub: debug
