server:
  port: 8084

spring:
  application:
    name: demandhub-agent
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:demandhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:demandhub123}
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: demandhub-agent-producer
    send-message-timeout: 5000

demandhub:
  integration:
    llm:
      # 大模型接入：true=内置 Mock（默认，本地/测试确定性）；false=火山方舟真实模型（需注入 LLM_API_KEY）
      mock: ${DEMANDHUB_INTEGRATION_LLM_MOCK:true}
  agent:
    llm:
      # 大模型平台 Mock（一期）：运行期可通过 /agent/admin/llm-switch 切换，模拟故障验证降级
      mock-enabled: true
      # SSE 流式分片大小与"思考"延迟，模拟真实流式体验
      chunk-size: 6
      think-delay-ms: 150
      # 火山方舟（OpenAI 兼容协议）：chat 走 JSON mode，embedding 独立模型；密钥经 env 注入不入仓库
      ark:
        base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
        api-key: ${LLM_API_KEY:}
        chat-model: ${LLM_CHAT_MODEL:ep-20260930122836-rv2gw}
        embedding-model: ${LLM_EMBEDDING_MODEL:ep-20260930123423-mq6hq}
        # vision 类 embedding 走 /embeddings/multimodal（input 类型化部件、data 为对象）；标准文本 embedding 改 false
        embedding-multimodal: ${LLM_EMBEDDING_MULTIMODAL:true}
        connect-timeout-ms: 3000
        # V4-Pro 为推理模型，长上下文需 30s+，放宽到 90s
        read-timeout-ms: 90000
        max-tokens: 2000
        temperature: 0.3
        failure-threshold: 3
        failure-cooldown-ms: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true
  packages-to-scan: com.demandhub.agent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demandhub: debug
