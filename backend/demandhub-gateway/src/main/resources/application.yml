server:
  port: 8080

spring:
  application:
    name: demandhub-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: demandhub-system
          uri: ${SYSTEM_URI:http://localhost:8081}
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        - id: demandhub-demand
          uri: ${DEMAND_URI:http://localhost:8082}
          predicates:
            - Path=/api/demand/**
          filters:
            - StripPrefix=1
        - id: demandhub-notification
          uri: ${NOTIFICATION_URI:http://localhost:8083}
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1
        - id: demandhub-agent
          uri: ${AGENT_URI:http://localhost:8084}
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=1

demandhub:
  auth:
    # 与 demandhub-system 保持一致；生产环境经环境变量 JWT_SECRET 注入
    jwt-secret: ${JWT_SECRET:demandhub-dev-secret-key-0123456789abcdef}

logging:
  level:
    org.springframework.cloud.gateway: info
