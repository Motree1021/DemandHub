server:
  port: 8080

spring:
  application:
    name: demandhub-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: demandhub-system
          uri: http://localhost:8081
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
        - id: demandhub-demand
          uri: http://localhost:8082
          predicates:
            - Path=/api/demand/**
          filters:
            - StripPrefix=1
        - id: demandhub-notification
          uri: http://localhost:8083
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1
        - id: demandhub-agent
          uri: http://localhost:8084
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=1

demandhub:
  auth:
    # 与 demandhub-system 保持一致；生产环境走配置中心/KMS
    jwt-secret: demandhub-dev-secret-key-0123456789abcdef

logging:
  level:
    org.springframework.cloud.gateway: info
