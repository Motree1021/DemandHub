server:
  port: 8082

spring:
  application:
    name: demandhub-demand
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:demandhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:demandhub123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 120MB

demandhub:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:demandhub}
    secret-key: ${MINIO_SECRET_KEY:demandhub123}
    bucket: ${MINIO_BUCKET:demandhub}
  sla:
    # SLA 超时扫描间隔（毫秒），自测 1 分钟 SLA 时保持默认 30s 即可
    scan-interval-ms: 30000
  stat:
    # 看板预聚合刷新（每 5 分钟）
    refresh-cron: 0 */5 * * * ?

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: demandhub-demand-producer
    send-message-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true
  packages-to-scan: com.demandhub.demand.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demandhub: debug
