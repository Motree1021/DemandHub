# DemandHub 前端 Nginx（阶段 8 生产编排）
# PC 端: http://host/        H5 端: http://host:81/
# /api 反代后端网关 gateway:8080（容器网络内）

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 120m;   # 与后端附件上传上限对齐

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream demandhub_gateway {
        server gateway:8080;
    }

    # PC 端（管理/看板/处理台）
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html/pc;
        index index.html;

        location /api/ {
            proxy_pass http://demandhub_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE（Agent 提报启发流式）必须关闭缓冲
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # H5 端（移动端）
    server {
        listen 81;
        server_name _;
        root /usr/share/nginx/html/h5;
        index index.html;

        location /api/ {
            proxy_pass http://demandhub_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
