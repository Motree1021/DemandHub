name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start dev dependencies (MySQL 3308 / contract-mock 8199)
        run: docker compose -f deploy/docker-compose.dev.yml up -d --build --wait

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen

      - name: Ruff
        working-directory: server
        run: uv run ruff check app tests alembic ../scripts/e2e_mvp.py

      - name: Pytest
        working-directory: server
        run: uv run pytest -q

  h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/h5/package-lock.json

      - name: Install dependencies
        working-directory: frontend/h5
        run: npm ci

      - name: Type check
        working-directory: frontend/h5
        run: npx tsc --noEmit

      - name: Vitest
        working-directory: frontend/h5
        run: npx vitest run

      - name: Build
        working-directory: frontend/h5
        run: npm run build
