server:
  port: 8081

spring:
  application:
    name: demandhub-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:demandhub}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:demandhub123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

demandhub:
  auth:
    # 与 demandhub-gateway 保持一致；生产环境经环境变量 JWT_SECRET 注入
    jwt-secret: ${JWT_SECRET:demandhub-dev-secret-key-0123456789abcdef}
    # access 2h / refresh 8h（任务 2.5）
    access-ttl-hours: ${JWT_ACCESS_TTL_HOURS:2}
    refresh-ttl-hours: ${JWT_REFRESH_TTL_HOURS:8}
    # 账密登录锁定策略（连续失败次数/锁定时长，审计留痕见应用日志）
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  channel-sso:
    # 是否暴露内置 Mock 创金零售 SSO 端点（MockChannelSsoController：签票 + 契约 verify），仅 dev=true；
    # 校验主链路单轨：ChannelSsoTicketVerifier → ChannelSsoClient 经 demand_channel.config_json 的
    # sso_verify_base_url 决定回源目标（dev 指向内置 Mock，test/prod 指向创金零售真实地址），
    # test/prod 的 base_url/app_key/app_secret 由管理端/环境注入（CHANNEL_SSO_MOCK=false）
    mock: ${CHANNEL_SSO_MOCK:true}
    # ENC: 密文主密钥（SecretCrypto）。env SECRET_STORE_KEY 无法经 relaxed binding 命中
    # demandhub.channel-sso.secret-store-key，必须显式占位；prod compose 注入真实值（无默认）。
    secret-store-key: ${SECRET_STORE_KEY:demandhub-dev-secret-store-key-0123456789}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true
  packages-to-scan: com.demandhub.system.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demandhub: debug
